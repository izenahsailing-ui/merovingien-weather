name: Izenah - alerte vent (horaire)
on:
  schedule:
    - cron: '0 * * * *'     # chaque heure
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: izenah-state
  cancel-in-progress: false
jobs:
  alerte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Surveillance coup de vent
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python izenah_bms_monitor.py
      - name: Persister l'etat anti-repetition
        run: |
          git config user.name "izenah-bot"
          git config user.email "izenah-bot@users.noreply.github.com"
          git add bms_state.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "maj etat alerte"
          git pull --rebase --autostash origin "${{ github.ref_name }}" || true
          git push || true
