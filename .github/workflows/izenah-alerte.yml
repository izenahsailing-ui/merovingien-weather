name: Izenah - alerte vent (surveillance continue)
on:
  schedule:
    # Toutes les 20 min : GitHub en saute beaucoup, on obtient ainsi ~1 passage/heure reel.
    # Anti-spam bms_state.json : jamais deux fois la meme alerte.
    # Ce job porte aussi le WATCHDOG du briefing (19h-23h) et le bilan sante du dimanche.
    - cron: '*/20 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: izenah-state
  cancel-in-progress: false
jobs:
  alerte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Surveillance coup de vent + watchdog briefing
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MF_APIKEY: ${{ secrets.MF_APIKEY }}
        run: python izenah_bms_monitor.py
      - name: Persister l'etat anti-repetition
        run: |
          git config user.name "izenah-bot"
          git config user.email "izenah-bot@users.noreply.github.com"
          git add archives sent_state.json bms_state.json bmsoff_state.json vig_state.json health_state.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "maj etat alerte"
          git pull --rebase --autostash origin "${{ github.ref_name }}" || true
          git push || true
      - name: Prevenir en cas d'echec
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="⚠️ IZENAH : la surveillance vent a echoue (run ${{ github.run_id }})." > /dev/null
